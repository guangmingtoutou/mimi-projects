name: build-windows-exe

# 手动触发：Actions 页面 Run workflow
# 或推送 v 开头 tag：自动构建并发布 Release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: xiaocao-analyzer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe (PyInstaller onefile)
        run: pyinstaller xiaocao.spec --noconfirm

      - name: Smoke test (import check)
        run: python -c "from backend import config, transcribe, vision, scoring, report, tasks; print('imports OK')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaocao-analyzer-windows
          path: xiaocao-analyzer/dist/*.exe

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: xiaocao-analyzer/dist/*.exe
          generate_release_notes: true
